<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hit Rate Hub</title>

    <style>
        :root{
            --bg:#03101f;
            --panel:#05182b;
            --line:#14314f;
            --text:#eef5ff;
            --muted:#92a9c7;
            --blue:#2f8cff;
            --blue2:#0e62d9;
            --green:#57d37b;
            --red:#ef6a6a;
            --shadow:0 14px 30px rgba(0,0,0,.28);
        }

        *{ box-sizing:border-box; }

        html,body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(42,122,255,.18), transparent 28%),
                linear-gradient(180deg, #05101d 0%, #020b16 100%);
            color:var(--text);
        }

        .page{ min-height:100vh; }

        .site-banner{
            position:relative;
            width:100%;
            max-height:260px;
            overflow:hidden;
            border-bottom:1px solid rgba(58,124,214,.28);
            background:#020b16;
        }

        .site-banner img{
            width:100%;
            height:auto;
            display:block;
        }

        .league-pill{
            width:70px;
            height:56px;
            border-radius:14px;
            border:1px solid rgba(110,170,240,.25);
            background:linear-gradient(180deg, rgba(10,28,48,.85), rgba(5,18,31,.95));
            display:flex;
            align-items:center;
            justify-content:center;
            color:#83c4ff;
            font-weight:800;
            font-size:16px;
            letter-spacing:.5px;
            box-shadow:0 8px 18px rgba(0,0,0,.3);
        }

        .top-nav-inner{
            max-width:1600px;
            margin:0 auto;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 20px;
        }

        .nav-left{
            display:flex;
            gap:6px;
            align-items:center;
        }

        .nav-right{
            display:flex;
            gap:10px;
            align-items:center;
        }

        .nav-right .league-pill{
            width:58px;
            height:40px;
            font-size:13px;
            border-radius:10px;
            border:1px solid rgba(110,170,240,.25);
            background:linear-gradient(180deg, rgba(10,28,48,.85), rgba(5,18,31,.95));
            color:#83c4ff;
            font-weight:900;
            cursor:pointer;
        }

        .nav-right .league-pill:hover{
            border-color:#2f8cff;
            box-shadow:0 0 14px rgba(47,140,255,.25);
        }

        .nav-right .active-league{
            background:linear-gradient(180deg, #1e78eb, #124f9d);
            color:white;
            border-color:#4aa3ff;
        }

        @media (max-width:900px){
            .top-nav-inner{
                flex-direction:column;
                align-items:stretch;
                gap:10px;
                padding:0 12px 12px;
            }

            .nav-left{
                overflow-x:auto;
            }

            .nav-right{
                justify-content:center;
                flex-wrap:wrap;
            }
        }

        .nav-tab{
            color:#a5b6cc;
            text-decoration:none;
            padding:18px 18px 16px;
            display:inline-flex;
            align-items:center;
            gap:10px;
            border-bottom:3px solid transparent;
            font-size:16px;
        }

        .nav-tab.active{
            color:#45a0ff;
            border-bottom-color:#1f8eff;
            background:linear-gradient(180deg, rgba(35,83,148,.22), rgba(35,83,148,0));
            border-top-left-radius:16px;
            border-top-right-radius:16px;
        }

        .shell{
            max-width:1600px;
            margin:18px auto 0;
            padding:0 16px 28px;
        }

        .main-grid{
            display:grid;
            grid-template-columns:1.45fr 1fr;
            gap:16px;
            align-items:start;
        }

        .panel{
            background:linear-gradient(180deg, rgba(5,23,40,.96), rgba(3,18,32,.98));
            border:1px solid rgba(59,118,191,.22);
            border-radius:12px;
            box-shadow:var(--shadow);
            overflow:hidden;
        }

        .panel-header{
            padding:16px 18px;
            border-bottom:1px solid rgba(75,125,185,.16);
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:16px;
        }

        .panel-title{
            color:#1f8eff;
            font-weight:800;
            font-size:15px;
            text-transform:uppercase;
            letter-spacing:.5px;
        }

        .panel-body{ padding:18px; }

        .calculator-grid{
            display:grid;
            grid-template-columns:1fr 1fr 1fr 150px;
            gap:14px;
        }

        .calculator-bottom{
            margin-top:14px;
            display:grid;
            grid-template-columns:1fr 1fr 1fr 1.2fr;
            gap:14px;
            align-items:end;
        }

        .filter-row{
            margin-top:14px;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:14px;
        }

        .field label{
            display:block;
            color:#d2dcef;
            font-size:13px;
            margin-bottom:8px;
            text-transform:uppercase;
            letter-spacing:.4px;
        }

        .field input,
        .field select{
            width:100%;
            height:40px;
            border-radius:8px;
            border:1px solid rgba(88,132,184,.3);
            background:#08182a;
            color:#eef6ff;
            padding:0 12px;
            font-size:14px;
        }

        .field input:focus,
        .field select:focus{
            outline:none;
            border-color:#2c8fff;
            box-shadow:0 0 0 3px rgba(44,143,255,.14);
        }

        .run-btn,
        .share-btn{
            width:100%;
            height:40px;
            border:none;
            border-radius:8px;
            color:#fff;
            font-weight:800;
            font-size:15px;
            cursor:pointer;
        }

        .run-btn{
            background:linear-gradient(180deg, #1e78eb, #1660c8);
        }

        .share-btn{
            background:linear-gradient(180deg, #124a91, #0b3569);
            border:1px solid rgba(85,145,222,.28);
        }

        .run-btn:hover,
        .share-btn:hover{ filter:brightness(1.05); }

        .help-box{
            border:1px solid rgba(74,126,190,.25);
            border-radius:10px;
            background:linear-gradient(180deg, rgba(8,24,42,.8), rgba(6,18,31,.95));
            padding:14px 14px 10px;
            min-height:215px;
        }

        .help-box h4{
            margin:0 0 12px;
            color:#2090ff;
            font-size:14px;
            text-transform:uppercase;
        }

        .help-box ul{
            margin:0;
            padding-left:16px;
            color:#c9d6e8;
            font-size:13px;
            line-height:1.55;
        }

        .help-box li{ margin-bottom:8px; }

        .sub-tabs{
            display:flex;
            gap:6px;
            border-bottom:1px solid rgba(75,125,185,.15);
            padding:0 14px;
        }

        .sub-tab{
            padding:14px 14px 12px;
            color:#94a9c3;
            border-bottom:3px solid transparent;
            font-size:15px;
        }

        .sub-tab.active{
            color:#f1f6ff;
            border-bottom-color:#1d8fff;
            background:linear-gradient(180deg, rgba(29,143,255,.12), rgba(29,143,255,0));
            border-top-left-radius:10px;
            border-top-right-radius:10px;
        }

        .summary-cards{
            display:grid;
            grid-template-columns:repeat(3, minmax(0, 1fr));
            gap:14px;
            padding:14px;
        }

        .summary-card{
            border:1px solid rgba(73,123,184,.22);
            border-radius:10px;
            background:linear-gradient(180deg, rgba(7,25,43,.92), rgba(4,18,31,.98));
            padding:14px 14px 12px;
            min-height:164px;
        }

        .summary-top{
            display:flex;
            align-items:flex-start;
            gap:10px;
            margin-bottom:12px;
        }

        .summary-rank{
            width:30px;
            height:30px;
            border-radius:6px;
            background:#1f79ea;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:800;
            color:#fff;
            flex:0 0 auto;
        }

        .summary-name{
            font-size:18px;
            font-weight:700;
            color:#eef5ff;
        }

        .summary-team{
            color:#90a7c2;
            font-size:13px;
            margin-top:2px;
        }

        .summary-stats{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:14px;
            margin-bottom:12px;
        }

        .summary-stat .big{
            font-size:22px;
            font-weight:800;
            color:#edf5ff;
        }

        .summary-stat .lab{
            color:#9fb0c7;
            font-size:12px;
            text-transform:uppercase;
            margin-top:4px;
            letter-spacing:.3px;
        }

        .mini-bar{
            height:6px;
            border-radius:999px;
            background:#203548;
            overflow:hidden;
            margin-top:10px;
        }

        .mini-bar span{
            display:block;
            height:100%;
            border-radius:999px;
            background:linear-gradient(90deg, #1574f0, #33a0ff);
        }

        .section-title{
            padding:0 14px 12px;
            color:#eaf2fc;
            font-size:14px;
            font-weight:800;
            text-transform:uppercase;
            letter-spacing:.4px;
        }

        .table-wrap{
            overflow:auto;
            border-top:1px solid rgba(75,125,185,.14);
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th, td{
            padding:11px 12px;
            border-bottom:1px solid rgba(72,108,148,.18);
            border-right:1px solid rgba(72,108,148,.12);
            white-space:nowrap;
            font-size:14px;
        }

        th:last-child, td:last-child{ border-right:none; }

        th{
            background:#0b2137;
            color:#d8e8fb;
            text-align:left;
            font-size:12px;
            text-transform:uppercase;
            letter-spacing:.5px;
            position:sticky;
            top:0;
            z-index:1;
        }

        tbody tr:hover{ background:rgba(35,86,148,.10); }

        .small{
            color:#93a7c1;
            font-size:12px;
            margin-top:4px;
        }

        .match-pill{
            display:inline-block;
            font-size:12px;
            padding:4px 9px;
            border-radius:6px;
            font-weight:700;
        }

        .hit-pill{
            color:#eaffef;
            background:#276d38;
        }

        .miss-pill{
            color:#fff0f0;
            background:#7a2e2e;
        }

        .no-game{ color:#7186a0; }

        .leader-filters{
            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            gap:14px;
            padding:0 18px 16px;
        }

        .leader-extra-filters{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:14px;
            padding:0 18px 16px;
        }

        .leader-top-note{
            color:#57a9ff;
            font-size:14px;
        }

        .heat-100{ background:rgba(75,151,63,.88); }
        .heat-80{ background:rgba(112,142,46,.88); }
        .heat-60{ background:rgba(151,117,36,.88); }
        .heat-40{ background:rgba(145,80,37,.88); }
        .heat-20{ background:rgba(131,49,49,.88); }

        .heat-cell{
            text-align:center;
            color:#fff;
            font-weight:700;
        }

        .footer-note{
            padding:18px;
            display:flex;
            align-items:center;
            gap:16px;
            color:#9fb2ca;
        }

        .footer-icon{
            width:48px;
            height:48px;
            border-radius:50%;
            border:2px solid #248dff;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#248dff;
            font-size:24px;
            flex:0 0 auto;
        }

        .share-row{
            display:grid;
            grid-template-columns:repeat(4, minmax(0, 1fr));
            gap:12px;
            padding:0 14px 16px;
        }

        .share-box{
            padding:14px;
            border-top:1px solid rgba(75,125,185,.14);
        }

        .share-note{
            color:#94acc9;
            font-size:13px;
            margin-top:10px;
        }

        .share-card-export{
            background:linear-gradient(180deg, rgba(7,25,43,.98), rgba(4,18,31,.98));
            border:1px solid rgba(73,123,184,.22);
            border-radius:12px;
            overflow:hidden;
        }

        .export-head{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:16px 18px;
            border-bottom:1px solid rgba(75,125,185,.14);
            background:linear-gradient(90deg, rgba(18,62,118,.8), rgba(6,22,39,.4));
        }

        .export-title{
            font-size:26px;
            font-weight:900;
            text-transform:uppercase;
            letter-spacing:.6px;
        }

        .export-title span{ color:#39a0ff; }

        .export-sub{
            font-size:13px;
            color:#aac4e4;
            margin-top:6px;
        }

        .export-brand{
            font-size:12px;
            color:#9bc0ea;
            text-align:right;
        }

        .export-footer{
            padding:12px 18px 16px;
            color:#89a5c7;
            font-size:12px;
        }

        .toast-wrap{
            position:fixed;
            right:18px;
            bottom:18px;
            display:flex;
            flex-direction:column;
            gap:10px;
            z-index:10000;
        }

        .toast{
            min-width:240px;
            max-width:360px;
            background:linear-gradient(180deg, rgba(14,47,85,.98), rgba(8,28,50,.98));
            border:1px solid rgba(79,148,233,.24);
            color:#edf6ff;
            padding:14px 16px;
            border-radius:12px;
            box-shadow:0 18px 36px rgba(0,0,0,.32);
            opacity:0;
            transform:translateY(8px);
            transition:.22s ease;
            font-size:14px;
        }

        .toast.show{
            opacity:1;
            transform:translateY(0);
        }

        .modal-backdrop{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.55);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:9999;
            padding:18px;
        }

        .modal-backdrop.show{ display:flex; }

        .modal{
            width:min(640px, 100%);
            background:linear-gradient(180deg, rgba(8,24,42,.98), rgba(5,18,31,.98));
            border:1px solid rgba(73,123,184,.22);
            border-radius:16px;
            box-shadow:0 25px 60px rgba(0,0,0,.45);
            overflow:hidden;
        }

        .modal-head{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            padding:18px 20px;
            border-bottom:1px solid rgba(75,125,185,.15);
        }

        .modal-title{
            color:#f3f8ff;
            font-size:20px;
            font-weight:800;
        }

        .modal-close{
            width:38px;
            height:38px;
            border-radius:10px;
            border:1px solid rgba(90,140,200,.28);
            background:#0a1a2d;
            color:#d7e8ff;
            cursor:pointer;
            font-size:18px;
            font-weight:800;
        }

        .modal-body{ padding:18px 20px 20px; }

        .modal-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
        }

        .bad{
            color:#ffecec;
            border:1px solid rgba(239,106,106,.25);
            background:rgba(122,46,46,.22);
            padding:12px;
            border-radius:10px;
        }

        @media (max-width:1280px){
            .main-grid,
            .calculator-grid,
            .calculator-bottom,
            .filter-row,
            .leader-filters,
            .leader-extra-filters,
            .summary-cards,
            .share-row,
            .modal-grid{
                grid-template-columns:1fr;
            }

            .league-pill{
                width:76px;
                height:62px;
                font-size:16px;
            }
            .lineup-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:22px;
    height:22px;
    border-radius:50%;
    font-size:12px;
    font-weight:900;
    margin-right:7px;
    color:#06101f;
}

.lineup-confirmed{
    background:#57d37b;
}

.lineup-probable{
    background:#ffd84d;
    color:#06101f;
}

.lineup-not-listed{
    background:#ef6a6a;
    color:white;
}

.lineup-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:28px;
    height:22px;
    padding:0 6px;
    border-radius:6px;
    font-size:11px;
    font-weight:800;
    margin-right:7px;
    letter-spacing:.5px;
}
.ts-wrapper.single .ts-control{
    background:#071b2f !important;
    border:1px solid #21466d !important;
    color:#fff !important;
    border-radius:10px !important;
    height:50px !important;
    padding:13px 14px !important;
    font-size:16px !important;
    box-shadow:none !important;
}

.ts-wrapper.single .ts-control input{
    color:#fff !important;
}

.ts-wrapper.single .ts-control .item{
    color:#fff !important;
}

.ts-dropdown{
    background:#071b2f !important;
    border:1px solid #21466d !important;
    color:#fff !important;
    border-radius:10px !important;
    overflow:hidden !important;
}

.ts-dropdown .option{
    color:#fff !important;
    padding:10px 14px !important;
    font-size:15px !important;
}

.ts-dropdown .option.active{
    background:#123b63 !important;
    color:#fff !important;
}

.ts-wrapper.focus .ts-control{
    border-color:#2f8cff !important;
    box-shadow:0 0 0 2px rgba(47,140,255,.25) !important;
}

.ts-control .placeholder{
    color:#92a9c7 !important;
}
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="site-banner">
            <img src="{{ url_for('static', filename='hitrate_banner.png') }}" alt="Hit Rate Hub banner">
        </div>

        <div class="top-nav">
            <div class="top-nav-inner">

                <div class="nav-left">
                    <a href="{{ url_for('index') }}" class="nav-tab {% if active_page == 'calculator' %}active{% endif %}">▮▮ Calculator</a>
                    <a href="{{ url_for('leaderboard_page') }}" class="nav-tab {% if active_page == 'leaderboard' %}active{% endif %}">🏆 Leaderboard</a>
                    <a href="{{ url_for('combos_page') }}" class="{% if active_page == 'combos' %}active{% endif %}">🔥 Combos</a>
                    <a href="{{ url_for('trends_page') }}" class="nav-tab {% if active_page == 'trends' %}active{% endif %}">↗ Trends</a>
                    <a href="{{ url_for('share_page') }}" class="nav-tab {% if active_page == 'share' %}active{% endif %}">⇪ Share</a>
                </div>

                <div class="nav-right">
                    <button class="league-pill active-league" type="button">MLB</button>
                    <button class="league-pill" type="button" onclick="showToast('NBA coming soon')">NBA</button>
                    <button class="league-pill" type="button" onclick="showToast('NHL coming soon')">NHL</button>
                    <button class="league-pill" type="button" onclick="showToast('NFL coming soon')">NFL</button>
                </div>

            </div>
        </div>

        {% block content %}{% endblock %}
    </div>

    <div id="toastWrap" class="toast-wrap"></div>

    <script>
        function showToast(message) {
            const wrap = document.getElementById("toastWrap");
            if (!wrap) return;

            const toast = document.createElement("div");
            toast.className = "toast";
            toast.textContent = message;
            wrap.appendChild(toast);

            requestAnimationFrame(() => toast.classList.add("show"));

            setTimeout(() => {
                toast.classList.remove("show");
                setTimeout(() => toast.remove(), 220);
            }, 2400);
        }
@media (max-width: 700px){

    .site-banner{
        max-height:120px;
    }

    .top-nav-inner{
        padding:0 10px 10px;
    }

    .nav-left{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:8px;
        overflow:visible;
    }

    .nav-tab{
        justify-content:center;
        padding:12px 10px;
        font-size:13px;
        background:#071b30;
        border:1px solid rgba(85,145,222,.22);
        border-radius:10px;
    }

    .shell{
        padding:0 10px 18px;
        margin-top:10px;
    }

    .panel{
        border-radius:10px;
    }

    .panel-header{
        padding:13px 14px;
        flex-direction:column;
        align-items:flex-start;
    }

    .panel-body{
        padding:14px;
    }

    .calculator-grid,
    .calculator-bottom,
    .filter-row,
    .leader-filters,
    .leader-extra-filters,
    .share-row{
        grid-template-columns:1fr !important;
        gap:10px;
    }

    .field input,
    .field select,
    .run-btn,
    .share-btn{
        height:46px;
        font-size:15px;
    }

    .summary-cards{
        grid-template-columns:1fr !important;
        padding:10px;
        gap:10px;
    }

    .summary-card{
        min-height:auto;
        padding:12px;
    }

    .summary-name{
        font-size:16px;
    }

    .summary-stat .big{
        font-size:20px;
    }

    .table-wrap{
        overflow-x:auto;
        -webkit-overflow-scrolling:touch;
    }

    table{
        min-width:720px;
    }

    th, td{
        padding:9px 10px;
        font-size:12px;
    }

    .export-head{
        flex-direction:column;
        align-items:flex-start;
        gap:8px;
        padding:14px;
    }

    .export-title{
        font-size:22px;
    }

    .export-brand{
        text-align:left;
    }
}
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
